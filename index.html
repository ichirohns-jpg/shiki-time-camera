    <section id="welcome" class="welcome" aria-labelledby="page-title">

        <h1 id="page-title">志木タイムカメラ</h1>
        <p class="spot">引又河岸</p>
        <p class="era">大正初期・復元イメージ</p>
        <div class="intro-art" aria-hidden="true"><img id="intro-layer" alt=""></div>

      <header class="camera-heading">
        <h2>志木タイムカメラ</h2>
        <p class="spot-name">引又河岸</p>
        <p class="camera-era">大正初期・復元イメージ</p>

      <button id="close-camera" class="close-camera" type="button">戻る</button>

          <svg viewBox="0 0 32 26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h7l2-4h8l2 4h7v18H3z"/><circle cx="16" cy="14" r="6"/></svg>
          <span>撮影</span>
        </button>
      </div>
    </section>

    <section id="results" class="results" aria-labelledby="result-title" hidden>
      <h2 id="result-title" tabindex="-1">2枚、撮れました</h2>
      <p class="result-spot">引又河岸 · 同じ瞬間の写真です</p>
      <figure class="photo">
        <figcaption>① 現在の写真</figcaption>
        <img id="current-photo" alt="撮影した現在の風景">
      </figure>
      <figure class="photo">
        <figcaption>② タイム写真</figcaption>
        <img id="time-photo" alt="同じ風景に高瀬舟と桟橋を重ねたタイム写真">
      </figure>
      <p class="era">大正初期・復元イメージ</p>
      <div class="result-actions">
        <button id="save-photos" class="primary" type="button" disabled>写真を保存（2枚）</button>
        <button id="retake" class="secondary" type="button">もう一度撮る</button>
      </div>
      <p id="save-help" class="save-help">保存画面で「画像を保存」を選んでください。</p>
      <p id="save-status" class="status" role="status" aria-live="polite"></p>
      <div id="download-links" class="download-links" hidden>
        <a id="download-current">現在の写真を開く</a>
        <a id="download-time">タイム写真を開く</a>
        <p class="save-help">開いた写真を長押しして保存できます。</p>
      </div>
    </section>

        current = makeCanvas(width, height);
        time = makeCanvas(width, height);
        const nowContext = current.getContext('2d', { alpha: false });
        const timeContext = time.getContext('2d', { alpha: false });
        if (!nowContext || !timeContext) throw new Error('canvas');
        // One video read only: both photos use these exact frozen pixels.
        nowContext.drawImage(video, (sourceWidth - cropWidth) / 2, (sourceHeight - cropHeight) / 2, cropWidth, cropHeight, 0, 0, width, height);
        video.pause();
        timeContext.drawImage(current, 0, 0);
        const contain = Math.min(width / overlay.naturalWidth, height / overlay.naturalHeight);
        const layerWidth = overlay.naturalWidth * contain;
        const layerHeight = overlay.naturalHeight * contain;
        timeContext.save();
        timeContext.globalAlpha = PHOTO_OPACITY;
        timeContext.drawImage(overlay, (width - layerWidth) / 2, (height - layerHeight) / 2, layerWidth, layerHeight);
        timeContext.restore();
        captureId = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
        const [currentBlob, timeBlob] = await Promise.all([toBlob(current), toBlob(time)]);
        discardPhotos();
        photoFiles = [new File([currentBlob], `shiki-hikimata-${captureId}-now.jpg`, { type: 'image/jpeg' }), new File([timeBlob], `shiki-hikimata-${captureId}-time.jpg`, { type: 'image/jpeg' })];
        photoUrls = photoFiles.map(file => URL.createObjectURL(file));
        byId('current-photo').src = photoUrls[0];
        byId('time-photo').src = photoUrls[1];
        byId('download-current').href = photoUrls[0];
        byId('download-time').href = photoUrls[1];
        byId('download-current').target = '_blank';
        byId('download-time').target = '_blank';
        byId('download-current').rel = 'noopener';
        byId('download-time').rel = 'noopener';
        saveButton.disabled = false;
        saveStatus.textContent = '';
        phase = 'results';
        stopTracks();
        show('results');
        window.scrollTo(0, 0);
        byId('result-title').focus({ preventScroll: true });
      } catch (error) {
        returnToWelcome('写真を作れませんでした。もう一度カメラをひらいて撮影してください。');
        startStatus.dataset.error = 'true';
      } finally {
        if (current) { current.width = 0; current.height = 0; }
        if (time) { time.width = 0; time.height = 0; }
        byId('close-camera').disabled = false;
      }
    }

    function showSaveFallback() {
      byId('download-links').hidden = false;
      saveStatus.textContent = 'それぞれの写真を開き、長押しして保存してください。';
    }

    async function savePhotos() {
      if (photoFiles.length !== 2 || saveButton.disabled) return;
      saveButton.disabled = true;
      saveStatus.textContent = '';
      try {
        // Files are already encoded; sharing starts within this user gesture.
        if (navigator.share && navigator.canShare && navigator.canShare({ files: photoFiles })) {
          await navigator.share({ files: photoFiles });
          saveStatus.textContent = '保存操作を終えたら、写真アプリで2枚を確認してください。';
        } else {
          showSaveFallback();
        }
      } catch (error) {
        if (error.name === 'AbortError') saveStatus.textContent = '保存画面を閉じました。もう一度保存できます。';
        else showSaveFallback();
      } finally {
        saveButton.disabled = photoFiles.length !== 2;
      }
    }

    openButton.addEventListener('click', startCamera);
    shutter.addEventListener('click', takePhotos);
    saveButton.addEventListener('click', savePhotos);
    byId('close-camera').addEventListener('click', () => returnToWelcome());
    byId('retake').addEventListener('click', startCamera);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && (phase === 'camera' || phase === 'starting')) returnToWelcome('続けるときは、カメラをひらいてください。');
    });
    window.addEventListener('pagehide', () => {
      if (phase === 'camera' || phase === 'starting') returnToWelcome();
      else stopTracks();
    });
  })();
  </script>
</body>
</html>
